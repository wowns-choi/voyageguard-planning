spring.application.name=voyageguard-planning
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3307/voyageguard_planning
spring.datasource.username=root
spring.datasource.password=voyageguard1234

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Sales BC 서비스 주소 - 회차 생성 시 재고 초기화(REST), 잔여재고 조회(REST)에 사용
sales.service.base-url=http://localhost:8082

# actuator는 기본적으로 /actuator/health만 외부에 노출함 - prometheus 엔드포인트도 명시적으로 열어야 함
management.endpoints.web.exposure.include=health,prometheus

# p95/p99 같은 percentile 계산에 필요한 히스토그램 버킷 데이터를 생성함 - 기본값은 꺼져있어서
# count/sum/max만 나오고 histogram_quantile() 계산 재료(버킷)가 없어 명시적으로 켜야 함
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# 콘솔뿐 아니라 파일로도 로그를 남김(레포 안 logs/, gitignore 처리) - Promtail이 이 파일을
# 지켜보다가 Loki로 보냄
logging.file.name=logs/planning.log

# 로그를 사람이 읽기 편한 텍스트가 아니라 JSON(ECS 스키마)으로 남김 - Loki에서 필드별로
# 정교하게 필터링(예: level="ERROR"만)할 수 있게 됨. 별도 의존성 없이 스프링 부트 내장 기능.
logging.structured.format.console=ecs
logging.structured.format.file=ecs
